name = "tseku-news"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

# news.tseku.dev as a Custom Domain. Wrangler creates the DNS record on deploy,
# as long as the tseku.dev zone is in this Cloudflare account.
routes = [
  { pattern = "news.tseku.dev", custom_domain = true }
]

# Daily refresh: one run at 23:00 UTC = 07:00 in Ulaanbaatar. It fetches every
# source in parallel and publishes the edition. Needs Workers Paid (30 s CPU).
[triggers]
crons = ["0 23 * * *"]

[[kv_namespaces]]
binding = "NEWS"
id = "2ea18921fad3426780c23e82a9cf7a7b"

# Stories, search index, and reads / likes / saves / hides. Schema in migrations/.
[[d1_databases]]
binding = "DB"
database_name = "tseku-news"
database_id = "bf6342b9-4c95-4a93-b7dc-a4a8ea8743ee"
migrations_dir = "migrations"

# Secret (not in this file): ADMIN_TOKEN, the sign-in passphrase.

[observability]
enabled = true
